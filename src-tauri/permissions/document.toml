[[permission]]
identifier = "allow-document-commands"
description = "Caller-owned document commands; paths are selected by Rust dialogs or OS launch/drop."
commands.allow = ["document_snapshot", "new_document", "open_documents", "save_document", "reload_document", "check_external", "request_close", "close_document", "read_local_image", "open_external_link", "set_document_title", "save_pasted_image", "print_document", "export_pdf", "request_exit", "read_clipboard", "write_clipboard_text"]
