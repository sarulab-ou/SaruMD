<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>無題</title>
  </head>
  <body>
    <div id="app">
      <header class="toolbar" aria-label="メニュー">
        <div class="menu-container">
          <button
            id="file-menu-button"
            aria-haspopup="menu"
            aria-expanded="false"
            aria-controls="file-menu"
            aria-keyshortcuts="Alt+f"
            title="Alt+F"
          >
            ファイル (<u>F</u>)
          </button>
          <div id="file-menu" role="menu" aria-label="ファイル" hidden>
            <button id="new" role="menuitem" aria-keyshortcuts="Control+n">
              <span>新しいウィンドウ</span><span class="shortcut">Ctrl+N</span>
            </button>
            <button id="open" role="menuitem" aria-keyshortcuts="Control+o">
              <span>開く…</span><span class="shortcut">Ctrl+O</span>
            </button>
            <div role="separator"></div>
            <button id="save" role="menuitem" aria-keyshortcuts="Control+s">
              <span>保存</span><span class="shortcut">Ctrl+S</span>
            </button>
            <button
              id="save-as"
              role="menuitem"
              aria-keyshortcuts="Control+Shift+s"
            >
              <span>名前を付けて保存…</span
              ><span class="shortcut">Ctrl+Shift+S</span>
            </button>
            <div role="separator"></div>
            <button id="export-pdf" role="menuitem">
              <span>PDFにエクスポート…</span>
            </button>
            <button id="print" role="menuitem" aria-keyshortcuts="Control+p">
              <span>印刷…</span><span class="shortcut">Ctrl+P</span>
            </button>
            <div role="separator"></div>
            <button id="exit" role="menuitem"><span>終了</span></button>
          </div>
        </div>
        <div class="menu-container">
          <button
            id="edit-menu-button"
            aria-haspopup="menu"
            aria-expanded="false"
            aria-controls="edit-menu"
            aria-keyshortcuts="Alt+e"
            title="Alt+E"
          >
            編集 (<u>E</u>)
          </button>
          <div id="edit-menu" role="menu" aria-label="編集" hidden>
            <button id="undo" role="menuitem" aria-keyshortcuts="Control+z">
              <span>元に戻す</span><span class="shortcut">Ctrl+Z</span>
            </button>
            <div role="separator"></div>
            <button id="cut" role="menuitem" aria-keyshortcuts="Control+x">
              <span>切り取り</span><span class="shortcut">Ctrl+X</span>
            </button>
            <button id="paste" role="menuitem" aria-keyshortcuts="Control+v">
              <span>貼り付け</span><span class="shortcut">Ctrl+V</span>
            </button>
            <button id="delete" role="menuitem" aria-keyshortcuts="Delete">
              <span>削除</span><span class="shortcut">Del</span>
            </button>
            <div role="separator"></div>
            <button id="find" role="menuitem" aria-keyshortcuts="Control+f">
              <span>検索する</span><span class="shortcut">Ctrl+F</span>
            </button>
            <button id="find-next" role="menuitem" aria-keyshortcuts="F3">
              <span>次を検索</span><span class="shortcut">F3</span>
            </button>
            <button
              id="find-previous"
              role="menuitem"
              aria-keyshortcuts="Shift+F3"
            >
              <span>前を検索</span><span class="shortcut">Shift+F3</span>
            </button>
            <button id="replace" role="menuitem" aria-keyshortcuts="Control+h">
              <span>置換</span><span class="shortcut">Ctrl+H</span>
            </button>
            <div role="separator"></div>
            <button id="timestamp" role="menuitem" aria-keyshortcuts="F5">
              <span>タイムスタンプを挿入</span><span class="shortcut">F5</span>
            </button>
          </div>
        </div>
      </header>
      <div id="notice" role="status" hidden>
        <span></span><button id="reload">再読み込み…</button>
      </div>
      <main id="split">
        <section class="pane source-pane" aria-label="Markdownソース">
          <div id="editor"></div>
        </section>
        <div
          id="divider"
          role="separator"
          tabindex="0"
          aria-label="編集とプレビューの幅"
          aria-orientation="vertical"
          aria-valuenow="50"
        ></div>
        <section class="pane preview-pane" aria-label="プレビュー">
          <iframe
            id="preview"
            title="Markdownプレビュー"
            sandbox="allow-same-origin"
            referrerpolicy="no-referrer"
          ></iframe>
        </section>
      </main>
      <footer>
        <span id="status" role="status">準備中…</span
        ><span id="format">UTF-8 · LF</span>
      </footer>
    </div>
    <article id="print-content" aria-hidden="true"></article>
    <dialog id="confirm">
      <form method="dialog">
        <h2></h2>
        <p></p>
        <div class="dialog-actions"></div>
      </form>
    </dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
