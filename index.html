<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>無題</title>
  </head>
  <body>
    <div id="app">
      <header class="toolbar" aria-label="ファイル操作">
        <div class="menu-container">
          <button
            id="file-menu-button"
            aria-haspopup="menu"
            aria-expanded="false"
            aria-controls="file-menu"
            aria-keyshortcuts="Alt+f"
            title="Alt+F"
          >
            ファイル
          </button>
          <div id="file-menu" role="menu" aria-label="ファイル" hidden>
            <button id="new" role="menuitem" aria-keyshortcuts="Control+n">
              <span>新しいウィンドウ</span><span class="shortcut">Ctrl+N</span>
            </button>
            <button id="open" role="menuitem" aria-keyshortcuts="Control+o">
              <span>開く…</span><span class="shortcut">Ctrl+O</span>
            </button>
            <div role="separator"></div>
            <button id="save" role="menuitem" aria-keyshortcuts="Control+s">
              <span>保存</span><span class="shortcut">Ctrl+S</span>
            </button>
            <button
              id="save-as"
              role="menuitem"
              aria-keyshortcuts="Control+Shift+s"
            >
              <span>名前を付けて保存…</span
              ><span class="shortcut">Ctrl+Shift+S</span>
            </button>
            <div role="separator"></div>
            <button id="export-pdf" role="menuitem">
              <span>PDFにエクスポート…</span>
            </button>
            <button id="print" role="menuitem" aria-keyshortcuts="Control+p">
              <span>印刷…</span><span class="shortcut">Ctrl+P</span>
            </button>
            <div role="separator"></div>
            <button id="exit" role="menuitem"><span>終了</span></button>
          </div>
        </div>
        <span class="toolbar-spacer"></span>
        <button id="search" title="Ctrl+F / Ctrl+H">検索・置換</button>
        <label class="remote-option"
          ><input type="checkbox" id="remote" />この文書の外部画像を許可</label
        >
      </header>
      <div id="path" class="path" title="フルパス">新規文書</div>
      <div id="notice" role="status" hidden>
        <span></span><button id="reload">再読み込み…</button>
      </div>
      <main id="split">
        <section class="pane source-pane" aria-label="Markdownソース">
          <div class="pane-label">MARKDOWN <span>ソース</span></div>
          <div id="editor"></div>
        </section>
        <div
          id="divider"
          role="separator"
          tabindex="0"
          aria-label="編集とプレビューの幅"
          aria-orientation="vertical"
          aria-valuenow="50"
        ></div>
        <section class="pane preview-pane" aria-label="プレビュー">
          <div class="pane-label">PREVIEW <span>プレビュー</span></div>
          <iframe
            id="preview"
            title="Markdownプレビュー"
            sandbox="allow-same-origin"
            referrerpolicy="no-referrer"
          ></iframe>
        </section>
      </main>
      <footer>
        <span id="status" role="status">準備中…</span
        ><span id="format">UTF-8 · LF</span>
      </footer>
    </div>
    <article id="print-content" aria-hidden="true"></article>
    <dialog id="confirm">
      <form method="dialog">
        <h2></h2>
        <p></p>
        <div class="dialog-actions"></div>
      </form>
    </dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
